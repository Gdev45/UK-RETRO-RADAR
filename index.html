#sl::-webkit-slider-runnable-track{height:4px;background:#c0c0c0;border:1px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #404040}
#sl::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:21px;margin-top:-9px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;border-radius:0}

  const now=Date.now()/1000;

  ov.save();
  for(const strike of lightning){
    const age=now - (strike.ts || now);
    if(age>LIGHTNING_WINDOW_SECONDS || age<0) continue;
    const [x,y]=P(strike.la,strike.lo);
    const radius=1.8 + (1 - Math.min(age,LIGHTNING_WINDOW_SECONDS)/LIGHTNING_WINDOW_SECONDS) * 4.4;
    ov.beginPath();
    ov.fillStyle=ageToColor(age);
    ov.arc(x,y,radius*u,0,Math.PI*2);
    ov.fill();
  }
  ov.restore();
}
async function refreshLightning(){
  const url=`https://live.lightningmaps.org/l/?v=24&l=${lightningSeq}&i=0`;
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)return;
    const data=await res.json();
    const now=Date.now()/1000;
    const kept=lightning.filter(s => (now - (s.ts || now)) <= LIGHTNING_WINDOW_SECONDS);
    if(!data||!Array.isArray(data.d)){
      lightning=kept.slice(-2000);
      if(typeof data?.s==='number') lightningSeq=data.s;
      return;
    }
    const list=[];
    for(const d of data.d){
      const la=Number(d.lat ?? d.latitude ?? d.y);
      const lo=Number(d.lon ?? d.longitude ?? d.x);
      const ts=Number(d.t ?? d.time ?? d.timestamp ?? d.ts ?? d.ms ?? d.when);
      if(!Number.isFinite(la)||!Number.isFinite(lo)||!Number.isFinite(ts)) continue;
      const seconds=ts>1e12?ts/1000:ts;
      const age=now-seconds;
      if(age<0 || age>LIGHTNING_WINDOW_SECONDS) continue;
      list.push({la,lo,ts:seconds,age});
    }
    lightning=[...kept, ...list].slice(-2000);
    if(typeof data.s==='number') lightningSeq=data.s;
  }catch(err){
    console.warn('Lightning feed unavailable',err);
  }
}
function applyZoomTransform(){
  mapLayer.style.transform=`translate(${viewTranslateX}px, ${viewTranslateY}px) scale(${viewZoom})`;
}
function applyLightningView(){
  radarCanvas.style.opacity = lightningOnly ? '0' : '1';
  radarCanvas.style.pointerEvents = 'none';
  radarCanvas.style.transition = 'opacity 0.15s ease';
  ovc.style.opacity = '1';
  $('lightningToggle').classList.toggle('active', lightningOnly);
  $('lightningToggle').textContent = lightningOnly ? 'Radar' : 'Lightning';
}
function zoomBy(factor,clientX,clientY){
  const rect=stage.getBoundingClientRect();
  const localX=(clientX-rect.left-viewTranslateX)/viewZoom;
  const localY=(clientY-rect.top-viewTranslateY)/viewZoom;
  const nextZoom=clamp(viewZoom*factor, MIN_ZOOM, MAX_ZOOM);
  viewTranslateX = clientX-rect.left - localX*nextZoom;
  viewTranslateY = clientY-rect.top - localY*nextZoom;
  viewZoom=nextZoom;
  applyZoomTransform();
  $('zoomReset').textContent=`${Math.round(viewZoom*100)}%`;
}
function resetZoom(){
  viewZoom=1; viewTranslateX=0; viewTranslateY=0; applyZoomTransform(); $('zoomReset').textContent='100%';
}

/* ---------- layout: data raster follows the window's aspect ratio ---------- */
function measure(){
  const b=$('stage').getBoundingClientRect();CW=Math.max(200,b.width);CH=Math.max(200,b.height);DPR=Math.min(3,window.devicePixelRatio||1);
  const S=2**(Z-5),a=CW/CH;let w,h;if(a<=.714){w=700*S;h=w/a}else{h=980*S;w=h*a}   // always keep the whole UK in frame

  OX=Math.round(mx)-SW/2;OY=Math.round(my)-SH/2;
  sizeRadar();ovc.width=Math.round(CW*DPR);ovc.height=Math.round(CH*DPR);legendCanvas.width=Math.round(CW*DPR);legendCanvas.height=Math.round(CH*DPR);drawOverlay();drawLegend();}
/* The radar canvas is drawn at true screen resolution: every screen pixel picks ONE data cell (nearest
   neighbour, no browser scaling, no blending). `cell` = size of each hard-edged block in data pixels. */
function sizeRadar(){
  const rcv=$('radar'),cw=SW,ch=SH;rcv.width=cw;rcv.height=ch;rc.imageSmoothingEnabled=false;
  img=rc.createImageData(cw,ch);px32=new Uint32Array(img.data.buffer);buildMaps();

function buildMaps(){
  const cw=$('radar').width,ch=$('radar').height,kx=cw/SW,ky=ch/SH,h=cell>>1;
  mapX=new Int32Array(cw);mapY=new Int32Array(ch);
  for(let x=0;x<cw;x++)mapX[x]=Math.min(SW-1,Math.floor(Math.floor(x/kx)/cell)*cell+h);
  for(let y=0;y<ch;y++)mapY[y]=Math.min(SH-1,Math.floor(Math.floor(y/ky)/cell)*cell+h)}

/* ---------- overlay: borders, cities, colour bar (drawn at screen resolution) ---------- */
const dec=a=>{let x=a[0],y=a[1];const p=[[x/100,y/100]];for(let i=2;i<a.length;i+=2){x+=a[i];y+=a[i+1];p.push([x/100,y/100])}return p};
function drawOverlay(){
  const u=DPR,kx=CW/SW*u,ky=CH/SH*u,w=ovc.width,h=ovc.height,small=CW<520;
  ov.setTransform(1,0,0,1,0,0);ov.clearRect(0,0,w,h);ov.lineJoin='round';ov.lineCap='round';
  const P=(la,lo)=>{const[x,y]=proj(la,lo);return[x*kx,y*ky]};
  const strokeRings=l=>{for(const a of l){ov.beginPath();dec(a).forEach(([lo,la],i)=>{const[x,y]=P(la,lo);i?ov.lineTo(x,y):ov.moveTo(x,y)});ov.stroke()}};
  ov.strokeStyle='rgba(200,170,0,.45)';ov.lineWidth=.6*u;strokeRings(GEO.b);   // counties
  ov.strokeStyle='#d8a800';ov.lineWidth=1.1*u;strokeRings(GEO.a);             // coasts & nation borders
  ov.font=(small?9:11)*u+'px "Courier New",monospace';ov.textAlign='left';
  for(const[n,la,lo]of[['London',51.51,-.13],['Birmingham',52.48,-1.9],['Manchester',53.48,-2.24],['Leeds',53.8,-1.55],['Newcastle',54.98,-1.62],['Glasgow',55.86,-4.25],['Edinburgh',55.95,-3.19],['Aberdeen',57.15,-2.09],['Inverness',57.48,-4.22],['Cardiff',51.48,-3.18],['Belfast',54.6,-5.93],['Dublin',53.35,-6.26],['Plymouth',50.37,-4.14],['Norwich',52.63,1.3],['Lerwick',60.15,-1.15],['Stornoway',58.21,-6.39]]){
    const[x,y]=P(la,lo);ov.fillStyle='#ff0';ov.fillRect(x-1.5*u,y-1.5*u,3*u,3*u);ov.fillStyle='#fff';ov.shadowColor='#000';ov.shadowBlur=3*u;ov.fillText(n,x+4*u,y+3.5*u);ov.shadowBlur=0}

function drawLegend(){
  const w=legendCanvas.width,h=legendCanvas.height,small=CW<520,u=DPR;
  lc.setTransform(1,0,0,1,0,0);lc.clearRect(0,0,w,h);
  const bw=(small?14:20)*u,bx=w-bw-8*u,top=64*u,bot=h-Math.max(34,small?40:30)*u,H=bot-top,yOf=d=>top+(90-d)/125*H;
  lc.save();lc.beginPath();lc.rect(bx,top,bw,H);lc.clip();lc.fillStyle='#000';lc.fillRect(bx,top,bw,H);
  PAL.forEach(([p,c],i)=>{const hi=yOf(i<PAL.length-1?PAL[i+1][0]:95);lc.fillStyle='#'+c;lc.fillRect(bx,hi,bw,yOf(p)-hi+.5)});lc.restore();
  lc.strokeStyle='#fff';lc.lineWidth=1.5*u;lc.strokeRect(bx-.75*u,top-.75*u,bw+1.5*u,H+1.5*u);

/* ---------- radar frames ---------- */
const loadImg=(u,cors)=>new Promise(r=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
const getTile=async u=>(await loadImg(u,1))||(await loadImg(u,0));
async function tryMode(f,[T,Z]){
  const sw=SW,sh=SH,ox=OX,oy=OY,cv=document.createElement('canvas');cv.width=sw;cv.height=sh;
  const g=cv.getContext('2d',{willReadFrequently:true});g.imageSmoothingEnabled=false;
  const x0=Math.floor(ox/T),x1=Math.floor((ox+sw-1)/T),y0=Math.max(0,Math.floor(oy/T)),y1=Math.floor((oy+sh-1)/T),jobs=[];
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)
    jobs.push(getTile(`${host}${f.path}/${T}/${Z}/${x}/${y}/2/0_0.png`).then(i=>{if(i)g.drawImage(i,x*T-ox,y*T-oy);return!!i}));
  if(!(await Promise.all(jobs)).some(Boolean))return false;
  if(f.gen!==gen)return true;
  try{
    const d=g.getImageData(0,0,sw,sh).data,a=new Uint8Array(sw*sh);
    for(let i=0;i<sw*sh;i++){const k=i*4;if(d[k+3]){const q=dbz(d[k],d[k+1],d[k+2],d[k+3]);if(q>=0)a[i]=Math.min(255,Math.round(q)+32)}}
    f.data=a;
  }catch(e){f.canvas=cv;window.tainted=true} // no CORS: show RainViewer's own colours
  return true}
async function loadFrame(f){for(const m of(mode?[mode]:MODES))if(await tryMode(f,m)){mode=m;return}throw new Error('no tiles')}
function show(){
  const r=ready();if(!r.length)return;idx=Math.max(0,Math.min(idx,r.length-1));const f=r[idx];
  const cw=$('radar').width,ch=$('radar').height;
  if(f.data){const d=f.data;let o=0;for(let y=0;y<ch;y++){const row=mapY[y]*SW;for(let x=0;x<cw;x++)px32[o++]=LUT[d[row+mapX[x]]]}rc.putImageData(img,0,0)}
  else{rc.clearRect(0,0,cw,ch);rc.imageSmoothingEnabled=false;rc.drawImage(f.canvas,0,0,cw,ch)}
  const D=new Date(f.time*1000),M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],p=n=>String(n).padStart(2,'0');
  $('title').textContent=`COMPOSITE BASE REFLECTIVITY — UNITED KINGDOM — ${D.getUTCDate()} ${M[D.getUTCMonth()]} ${p(D.getUTCFullYear()%100)} ${p(D.getUTCHours())}:${p(D.getUTCMinutes())}Z`+(idx<r.length-1?`  (−${Math.round((r[r.length-1].time-f.time)/60)} MIN)`:'  (LATEST)');
  const s=$('sl');s.max=r.length-1;s.value=idx}
function tick(){clearTimeout(timer);if(!playing)return;const n=ready().length;
  timer=setTimeout(()=>{if(n>1)idx=(idx+1)%n;show();tick()},idx===n-1?1600:+$('spd').value)}
function setPlay(p){playing=p;$('play').textContent=p?'❚❚':'►';tick()}
function status(){const r=ready(),st=$('st');if(!lastOk||!r.length)return;const age=Math.max(0,Math.round((Date.now()/1000-r[r.length-1].time)/60));st.className=age>45?'err':'';st.textContent=`LIVE · frame ${age} min old`+(window.tainted?' (no-CORS)':'')}
async function refresh(){
  const st=$('st'),g0=gen;

    const res=await fetch(API,{cache:'no-store'});if(!res.ok)throw new Error('API '+res.status);
    const j=await res.json();if(g0!==gen)return true;host=j.host;
    const list=(j.radar&&j.radar.past)||[];if(!list.length)throw new Error('no frames listed');

}
/* ---------- wiring ---------- */
$('play').onclick=()=>setPlay(!playing);
$('prev').onclick=()=>{setPlay(false);idx=(idx-1+ready().length)%ready().length;show()};
$('next').onclick=()=>{setPlay(false);idx=(idx+1)%ready().length;show()};
$('first').onclick=()=>{setPlay(false);idx=0;show()};
$('last').onclick=()=>{setPlay(false);idx=ready().length-1;show()};
$('zoomIn').onclick=()=>zoomBy(1.2, CW/2, CH/2);
$('zoomOut').onclick=()=>zoomBy(1/1.2, CW/2, CH/2);
$('zoomReset').onclick=()=>resetZoom();
$('lightningToggle').onclick=()=>{lightningOnly=!lightningOnly;applyLightningView();};
$('px').onchange=e=>{cell=+e.target.value;buildMaps();show()};
$('sl').oninput=e=>{setPlay(false);idx=+e.target.value;show()};
$('loadPal').onclick=()=>$('palFile').click();
function applyPalette(nextPal, message){
  PAL=[...nextPal];
  LUT=buildLutFromPalette(PAL);
  drawLegend();
  show();
  if(message) $('ro').textContent=message;
}
$('resetPal').onclick=()=>{applyPalette(DEFAULT_PAL.map(([d,c])=>[d,c]),'Default radar palette restored');};
$('palFile').onchange=async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  try{
    const text=await file.text();
    applyPalette(parsePalFileText(text), `Loaded custom palette: ${file.name}`);
  }catch(err){

addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing)}else if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='ArrowRight')$('next').click()});
/* live readout: lat/lon, dBZ and rain rate (Marshall-Palmer Z=200R^1.6) under the pointer */
const ro=$('ro'),stage=$('stage'),mapLayer=$('mapLayer'),HINT=ro.textContent;
const inv=(x,y)=>{const wx=x+OX,wy=y+OY;return[Math.atan(Math.sinh(Math.PI*(1-2*wy/W)))*180/Math.PI,wx/W*360-180]};
function getMidpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function pointerToMapCoords(clientX,clientY){
  const b=stage.getBoundingClientRect();
  const px=(clientX-b.left-viewTranslateX)/Math.max(1,viewZoom),py=(clientY-b.top-viewTranslateY)/Math.max(1,viewZoom);
  return {x:Math.floor((px/b.width)*SW),y:Math.floor((py/b.height)*SH)};
}

  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2){
    const pts=[...activePointers.values()];
    const center=getMidpoint(pts[0],pts[1]);

      startZoom:viewZoom,
      startTranslateX:viewTranslateX,
      startTranslateY:viewTranslateY,
      startDistance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),
      centerX:center.x,
      centerY:center.y

    dragMode=null;
    stage.style.cursor='grabbing';
    return;
  }
  if(e.pointerType==='touch' || viewZoom>1){
    dragMode={startX:e.clientX,startY:e.clientY,startTranslateX:viewTranslateX,startTranslateY:viewTranslateY};

    stage.style.cursor='grabbing';
  }
});
stage.addEventListener('pointermove',e=>{
  if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size>=2 && pinchState){
    const pts=[...activePointers.values()];
    const center=getMidpoint(pts[0],pts[1]);
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y) || 1;
    const nextZoom=clamp(pinchState.startZoom * (dist / pinchState.startDistance), MIN_ZOOM, MAX_ZOOM);
    const localX=(center.x - pinchState.startTranslateX) / pinchState.startZoom;
    const localY=(center.y - pinchState.startTranslateY) / pinchState.startZoom;
    viewTranslateX=center.x - localX * nextZoom;
    viewTranslateY=center.y - localY * nextZoom;
    viewZoom=nextZoom;

    return;
  }
  if(dragMode){
    viewTranslateX=dragMode.startTranslateX + (e.clientX-dragMode.startX);
    viewTranslateY=dragMode.startTranslateY + (e.clientY-dragMode.startY);

    return;
  }
  const b=stage.getBoundingClientRect(),px=(e.clientX-b.left-viewTranslateX)/Math.max(1,viewZoom),py=(e.clientY-b.top-viewTranslateY)/Math.max(1,viewZoom),x=Math.floor((px/b.width)*SW),y=Math.floor((py/b.height)*SH);
  if(x<0||y<0||x>=SW||y>=SH)return;const[la,lo]=inv(x,y),f=ready()[idx];
  let s=`${Math.abs(la).toFixed(2)}°${la>=0?'N':'S'} ${Math.abs(lo).toFixed(2)}°${lo>=0?'E':'W'}`;
  if(f&&f.data){const v=f.data[y*SW+x];if(v){const d=v-32,R=Math.pow(Math.pow(10,d/10)/200,1/1.6);s+=` · ${d} dBZ · ${R<.1?'<0.1':R.toFixed(R<10?1:0)} mm/h`}else s+=' · no echo'}
  ro.textContent=s});
stage.addEventListener('pointerup',e=>{activePointers.delete(e.pointerId);if(activePointers.size<2)pinchState=null;if(dragMode){dragMode=null;stage.releasePointerCapture?.(e.pointerId);stage.style.cursor='crosshair';}if(activePointers.size===0){stage.style.cursor='crosshair';}});

stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*0.0015), e.clientX, e.clientY);},{passive:false});
/* resize / rotate: redraw the overlay, and rebuild the raster if the window's shape changed */

  if(d[0]!==SW||d[1]!==SH){gen++;frames=[];idx=0;setup(d);refresh()}else{sizeRadar();ovc.width=Math.round(CW*DPR);ovc.height=Math.round(CH*DPR);legendCanvas.width=Math.round(CW*DPR);legendCanvas.height=Math.round(CH*DPR);drawOverlay();drawLegend();show()}},250)});
setup(measure());
applyZoomTransform();
$('zoomReset').textContent='100%';
applyLightningView();
refreshLightning();
lightningRefreshTimer=setInterval(refreshLightning,15000);
(function loop(){refresh().then(ok=>{if(ok&&!timer&&playing)setPlay(true);if(!ok)fails++;setTimeout(loop,ok?120000:Math.min(60000,15000*Math.max(1,fails)))})})();
setInterval(status,30000);
addEventListener('online',()=>refreshLightning());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastOk>120000)refresh()});
